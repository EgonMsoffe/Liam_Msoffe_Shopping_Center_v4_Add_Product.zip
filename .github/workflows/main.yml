
name: Build Liam Msoffe Shopping Center v4

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Extract v4 Android project
        run: |
          
mkdir -p extracted

ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

if [ -z "$ZIP_FILE" ]; then
  echo "ZIP file not found in repository root ls -laexit 1fi

echo "Using ZIP: $ZIP_FILE"
unzip -o "$ZIP_FILE" -d extracted
      - name: Verify Android project
        run: |
          test -f extracted/LiamAndroid/app/build.gradle
          test -f extracted/LiamAndroid/app/src/main/assets/index.html
      - name: Build APK
        run: |
          cd extracted/LiamAndroid
          gradle assembleDebug

      - name: Verify APK
        run: |
          test -f extracted/LiamAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liam-Msoffe-Shopping-Center-v4
          path: extracted/LiamAndroid/app/build/outputs/apk/debug/app-debug.apk

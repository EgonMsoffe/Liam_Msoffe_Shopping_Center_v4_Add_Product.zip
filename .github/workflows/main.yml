
name: Build Liam Msoffe Shopping Center APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Find and extract Android ZIP
        run: |
          mkdir -p extracted

          echo "Repository files:"
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | grep -v 'gradle-8.9-bin.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android source ZIP found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | grep '/app/build.gradle' | head -n 1 | sed 's#/app/build.gradle##')

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) | head -n 1 | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            find extracted -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android project found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Locate APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR" -type f -name '*.apk' | grep '/outputs/apk/' | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated!"
            find "$PROJECT_DIR" -type f
            exit 1
          fi

          echo "APK found: $APK_FILE"
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Liam-Msoffe-Shopping-Center-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
